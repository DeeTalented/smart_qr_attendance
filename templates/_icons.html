{# Small inline SVG icons (stroke style), so no icon font or CDN is needed. #}
{% macro icon(name) -%}
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == "qr" -%}
    <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
    <rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/>
{%- elif name == "users" -%}
    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
    <path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
{%- elif name == "book" -%}
    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/>
{%- elif name == "chart" -%}
    <path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>
{%- elif name == "clock" -%}
    <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{%- elif name == "plus" -%}
    <path d="M12 5v14M5 12h14"/>
{%- elif name == "key" -%}
    <circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3 21 2M17 6l3 3M15 8l2 2"/>
{%- elif name == "check" -%}
    <path d="M20 6 9 17l-5-5"/>
{%- elif name == "scan" -%}
    <path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10"/>
{%- elif name == "download" -%}
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>
{%- endif -%}
</svg>
{%- endmacro %}
